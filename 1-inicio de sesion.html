<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión | Centro Óptico La Económica F.P.</title>
  <link rel="stylesheet" href="estilo1.css">
</head>
<body class="login-page">
  <div class="glass-card" style="max-width: 420px;">
    <div class="login-logo">
      <h1>👁️ Centro Óptico</h1>
      <p>La Económica F.P.</p>
    </div>
    <h2>Inicio de Sesión</h2>
    <form onsubmit="event.preventDefault(); window.location.href='2-pagina-principal2.html';">
      <div class="form-group">
        <label for="Usuario">Usuario</label>
        <input type="text" id="Usuario" name="Usuario" placeholder="Ej: admin" required>
      </div>
      <div class="form-group">
        <label for="Contraseña">Contraseña</label>
        <input type="password" id="Contraseña" name="Contraseña" placeholder="••••••••" required>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
        <button type="reset" class="btn btn-danger">Cancelar</button>
      </div>
    </form>
  </div>
</body>
</html>
